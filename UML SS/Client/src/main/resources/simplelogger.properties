# SLF4J Simple Logger Configuration

# Log level (trace, debug, info, warn, error)
org.slf4j.simpleLogger.defaultLogLevel=info

# Show date time
org.slf4j.simpleLogger.showDateTime=true

# Date time format
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss

# Show thread name
org.slf4j.simpleLogger.showThreadName=false

# Show logger name
org.slf4j.simpleLogger.showLogName=true

# Show short logger name
org.slf4j.simpleLogger.showShortLogName=true

# Log file (if needed, uncomment and set path)
# org.slf4j.simpleLogger.logFile=study-client.log

# Set specific logger levels
org.slf4j.simpleLogger.log.com.example.client=info
org.slf4j.simpleLogger.log.okhttp3=warn
